name: CI

on:
  push:
    branches: [ "main", "test" ]
  pull_request:
    branches: [ "main" ]

jobs:
  python-test:
    name: Python GTK4 & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-gi gir1.2-gtk-4.0 python3-pip python3-venv adb scrcpy

      - name: Install Test Dependencies
        run: |
          python3 -m venv --system-site-packages "$RUNNER_TEMP/open-android-dex-venv"
          "$RUNNER_TEMP/open-android-dex-venv/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/open-android-dex-venv/bin/python" -m pip install pytest flake8

      - name: Lint with Flake8
        run: |
          "$RUNNER_TEMP/open-android-dex-venv/bin/flake8" . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run Pytest Suite
        run: |
          PYTHONPATH=. "$RUNNER_TEMP/open-android-dex-venv/bin/python" -m pytest tests/ -v

  flutter-analyze-test:
    name: Flutter Lint & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: "stable"

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev libavcodec-dev libavformat-dev libswscale-dev libavutil-dev

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Verify Code Formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Run Static Analysis
        run: flutter analyze

      - name: Run Flutter Tests
        run: flutter test
