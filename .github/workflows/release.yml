name: Build & Release Automation

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release Tag (e.g. v2.0.1)"
        required: false
        default: "v2.0.1"
      draft:
        description: "Create as Draft Release"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  run-tests:
    name: 🧪 Automated Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3 python3-gi gir1.2-gtk-4.0 adb scrcpy \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev libavcodec-dev libavformat-dev libswscale-dev libavutil-dev

      - name: Run Python Test Suite
        run: /usr/bin/python3 run_tests.py

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: "stable"

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Verify Code Formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Static Analysis
        run: flutter analyze --no-fatal-infos

      - name: Run Flutter Unit & Widget Tests
        run: flutter test

  build-linux-appimage:
    name: 🐧 Build Linux x86_64 AppImage
    needs: run-tests
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: "stable"

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config make \
            libgtk-3-dev libavcodec-dev libavformat-dev libswscale-dev libavutil-dev \
            file curl tar desktop-file-utils adb scrcpy

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Resolve Release Version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VER="${{ github.event.inputs.tag_name }}"
          else
            VER="${{ github.ref_name }}"
          fi
          echo "version=${VER:-v2.0.1}" >> $GITHUB_OUTPUT

      - name: Build AppImage
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          chmod +x scripts/build_appimage.sh
          ./scripts/build_appimage.sh "$APP_VERSION"

      - name: Validate AppImage
        run: |
          APPIMAGE=$(ls build/release_artifacts/Open-Android-DeX-*.AppImage | head -n 1)
          if [ -z "$APPIMAGE" ] || [ ! -f "$APPIMAGE" ]; then
            echo "❌ Error: AppImage artifact was not generated!" >&2
            exit 1
          fi
          ls -lh "$APPIMAGE"
          sha256sum "$APPIMAGE"

          # Verify runtime link integrity and ensure no missing library errors
          chmod +x "$APPIMAGE"
          "$APPIMAGE" --appimage-extract
          echo "Inspecting AppImage binary dependencies:"
          LD_LIBRARY_PATH="squashfs-root/usr/lib:${LD_LIBRARY_PATH:-}" ldd squashfs-root/usr/bin/open_android_dex
          MISSING=$(LD_LIBRARY_PATH="squashfs-root/usr/lib:${LD_LIBRARY_PATH:-}" ldd squashfs-root/usr/bin/open_android_dex 2>&1 | grep "not found" || true)
          if [ -n "$MISSING" ]; then
            echo "❌ Error: Missing libraries found inside AppImage:" >&2
            echo "$MISSING" >&2
            exit 1
          fi
          if LD_LIBRARY_PATH="squashfs-root/usr/lib:${LD_LIBRARY_PATH:-}" ldd squashfs-root/usr/bin/open_android_dex 2>&1 | grep "libgme" ; then
            echo "❌ Error: libgme found in dependencies!" >&2
            exit 1
          fi
          echo "✅ AppImage verified: zero missing libraries and zero libgme dependency!"
          rm -rf squashfs-root

      - name: Upload Linux AppImage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: build/release_artifacts/Open-Android-DeX-*.AppImage
          retention-days: 7

  build-windows:
    name: 🪟 Build Windows 11 x64 (Installer & Portable)
    needs: run-tests
    runs-on: windows-2022
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: "stable"

      - name: Enable Windows Desktop Support
        run: flutter config --enable-windows-desktop

      - name: Verify Toolchain (flutter doctor)
        run: flutter doctor -v

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Build Windows Application (Release)
        run: flutter build windows --release

      - name: Resolve Release Version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VER="${{ github.event.inputs.tag_name }}"
          else
            VER="${{ github.ref_name }}"
          fi
          echo "version=${VER:-v2.0.1}" >> $GITHUB_OUTPUT

      - name: Package Windows Artifacts
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          .\scripts\build_windows.ps1 -Version "$env:APP_VERSION"

      - name: Validate Windows Artifacts
        shell: pwsh
        run: |
          $Setup = (Get-ChildItem build\release_artifacts\Open-Android-DeX-*-Windows-x64-Setup.exe | Select-Object -First 1).FullName
          $Zip = (Get-ChildItem build\release_artifacts\Open-Android-DeX-*-Windows-x64-Portable.zip | Select-Object -First 1).FullName
          if (-not $Setup -or -not (Test-Path $Setup) -or (Get-Item $Setup).Length -lt 100000) {
            Write-Error "Installer is missing or invalid size."
            exit 1
          }
          if (-not $Zip -or -not (Test-Path $Zip) -or (Get-Item $Zip).Length -lt 100000) {
            Write-Error "Portable ZIP is missing or invalid size."
            exit 1
          }
          Get-FileHash -Algorithm SHA256 $Setup, $Zip | Format-Table

      - name: Upload Windows Setup Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-setup
          path: build/release_artifacts/Open-Android-DeX-*-Windows-x64-Setup.exe
          retention-days: 7

      - name: Upload Windows Portable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: build/release_artifacts/Open-Android-DeX-*-Windows-x64-Portable.zip
          retention-days: 7

  publish-release:
    name: 📦 Publish GitHub Release
    needs: [build-linux-appimage, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download All Release Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_files
          merge-multiple: true

      - name: Compute SHA256 Checksums
        working-directory: release_files
        run: |
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create Unversioned Release Aliases
        working-directory: release_files
        run: |
          for f in Open-Android-DeX-*-Linux-x86_64.AppImage; do
            [ -f "$f" ] && cp -v "$f" "Open-Android-DeX-Linux-x86_64.AppImage" || true
          done
          for f in Open-Android-DeX-*-Windows-x64-Setup.exe; do
            [ -f "$f" ] && cp -v "$f" "Open-Android-DeX-Windows-x64-Setup.exe" || true
          done
          for f in Open-Android-DeX-*-Windows-x64-Portable.zip; do
            [ -f "$f" ] && cp -v "$f" "Open-Android-DeX-Windows-x64-Portable.zip" || true
          done

      - name: Resolve Release Tag & Draft Flag
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
            DRAFT="${{ github.event.inputs.draft }}"
          else
            TAG="${{ github.ref_name }}"
            DRAFT="false"
          fi
          echo "tag=${TAG:-v2.0.1}" >> $GITHUB_OUTPUT
          echo "draft=${DRAFT:-false}" >> $GITHUB_OUTPUT

      - name: Generate Release Notes
        id: notes
        run: |
          TAG="${{ steps.vars.outputs.tag }}"
          cat << 'EOF' > RELEASE_NOTES.md
          # Open Android DeX — __TAG__

          Welcome to the cross-platform release of **Open Android DeX** (__TAG__)!

          ---

          ## 🚀 What's New in __TAG__

          ### 🐛 Bug Fixes & Stability
          - **Fixed Windows Resize Crash**: Resolved window crash caused by sub-pixel rounding and surface recreation during window resizing (#8).
          - **Isolated Windows Installer Path & Identity**: Assigned dedicated application GUID `{9B5A3C72-84E1-4D6F-90D3-E6E450E1854F}` and installation path `{autopf}\Bit-Manipulators\Open Android DeX` to eliminate conflict with third-party apps (#7).
          - **Multi-Display Window Routing**: Fixed issue where launched applications opened on physical phone display instead of the desktop compositor (#8).
          - **Prevented Calculator Auto-Popup**: Eliminated unintended launch of Calculator app during desktop session initialization (#8).
          - **Samsung Galaxy / One UI App Identifiers & Icons**: Added mapping for Samsung Galaxy system apps (Calculator, Samsung Internet, Gallery, My Files, Camera, Clock, Voice Recorder, etc.) (#8).

          ### 🪟 Windows 11 (x64) Support
          - **Native Windows Desktop Runner**: Full multi-window compositor running natively under Win32.
          - **In-Process Video Streaming**: Low-latency video texture streaming via `flutter::PixelBufferTexture`.
          - **USB Connection Detection**: Automatic ADB device discovery and authorization handling.
          - **Distributions**:
            - `Open-Android-DeX-Windows-x64-Setup.exe` (Complete Inno Setup installer)
            - `Open-Android-DeX-Windows-x64-Portable.zip` (Zero-install standalone package)

          ### 🐧 Linux AppImage Distribution
          - **Portable Single-File Release**: `Open-Android-DeX-Linux-x86_64.AppImage`.
          - **Cross-Distro Compatibility**: Bundles Flutter engine, runtime libraries, and FFmpeg dependencies.
          - **Dual Display Server Support**: Works seamlessly under Wayland (Hyprland, Sway, GNOME, KDE) and X11.

          ### 📱 Core & Gesture Enhancements
          - **Natural Trackpad & Touchpad Scrolling**: Two-finger smooth scrolling and pan/zoom mapping.
          - **Real-Time Icon Caching**: Isolated per-device icon cache streaming.
          - **Cross-Platform Architecture**: Unified `PlatformAdapter` handling paths, processes, and IPC.

          ---

          ## 📋 Release Checksums (SHA-256)
          EOF

          sed -i "s/__TAG__/${TAG}/g" RELEASE_NOTES.md
          cat release_files/SHA256SUMS.txt >> RELEASE_NOTES.md

      - name: Publish Release on GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: "Open Android DeX ${{ steps.vars.outputs.tag }}"
          body_path: RELEASE_NOTES.md
          draft: ${{ steps.vars.outputs.draft == 'true' }}
          prerelease: false
          make_latest: true
          files: |
            release_files/*
