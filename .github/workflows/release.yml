name: Build & Release Automation

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release Tag (e.g. v2.0.4)"
        required: false
        default: "v2.0.4"
      draft:
        description: "Create as Draft Release"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  run-tests:
    name: 🧪 Automated Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3 python3-gi gir1.2-gtk-4.0 adb scrcpy \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev libavcodec-dev libavformat-dev libswscale-dev libavutil-dev

      - name: Run Python Test Suite
        run: /usr/bin/python3 run_tests.py

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: "stable"

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Verify Code Formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Static Analysis
        run: flutter analyze --no-fatal-infos

      - name: Run Flutter Unit & Widget Tests
        run: flutter test

  build-linux-appimage:
    name: 🐧 Build Linux x86_64 AppImage
    needs: run-tests
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: "stable"

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config make \
            libgtk-3-dev libavcodec-dev libavformat-dev libswscale-dev libavutil-dev \
            file curl tar desktop-file-utils adb scrcpy

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Resolve Release Version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VER="${{ github.event.inputs.tag_name }}"
          else
            VER="${{ github.ref_name }}"
          fi
          echo "version=${VER:-v2.0.4}" >> $GITHUB_OUTPUT

      - name: Build AppImage
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          chmod +x scripts/build_appimage.sh
          ./scripts/build_appimage.sh "$APP_VERSION"

      - name: Validate AppImage
        run: |
          APPIMAGE=$(ls build/release_artifacts/Open-Android-DeX-*.AppImage | head -n 1)
          if [ -z "$APPIMAGE" ] || [ ! -f "$APPIMAGE" ]; then
            echo "❌ Error: AppImage artifact was not generated!" >&2
            exit 1
          fi
          ls -lh "$APPIMAGE"
          sha256sum "$APPIMAGE"

          # Verify runtime link integrity and ensure no missing library errors
          chmod +x "$APPIMAGE"
          "$APPIMAGE" --appimage-extract
          echo "Inspecting AppImage binary dependencies:"
          LD_LIBRARY_PATH="squashfs-root/usr/lib:${LD_LIBRARY_PATH:-}" ldd squashfs-root/usr/bin/open_android_dex
          MISSING=$(LD_LIBRARY_PATH="squashfs-root/usr/lib:${LD_LIBRARY_PATH:-}" ldd squashfs-root/usr/bin/open_android_dex 2>&1 | grep "not found" || true)
          if [ -n "$MISSING" ]; then
            echo "❌ Error: Missing libraries found inside AppImage:" >&2
            echo "$MISSING" >&2
            exit 1
          fi
          if LD_LIBRARY_PATH="squashfs-root/usr/lib:${LD_LIBRARY_PATH:-}" ldd squashfs-root/usr/bin/open_android_dex 2>&1 | grep "libgme" ; then
            echo "❌ Error: libgme found in dependencies!" >&2
            exit 1
          fi
          echo "✅ AppImage verified: zero missing libraries and zero libgme dependency!"
          rm -rf squashfs-root

      - name: Upload Linux AppImage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: build/release_artifacts/Open-Android-DeX-*.AppImage
          retention-days: 7

  build-windows:
    name: 🪟 Build Windows 11 x64 (Installer & Portable)
    needs: run-tests
    runs-on: windows-2022
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: "stable"

      - name: Enable Windows Desktop Support
        run: flutter config --enable-windows-desktop

      - name: Verify Toolchain (flutter doctor)
        run: flutter doctor -v

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Resolve Release Version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VER="${{ github.event.inputs.tag_name }}"
          else
            VER="${{ github.ref_name }}"
          fi
          echo "version=${VER:-v2.0.4}" >> $GITHUB_OUTPUT

      - name: Build & Package Windows Artifacts
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          .\scripts\build_windows.ps1 -Version "$env:APP_VERSION"

      - name: Validate Windows Artifacts
        shell: pwsh
        run: |
          $Setup = (Get-ChildItem build\release_artifacts\Open-Android-DeX-*-Windows-x64-Setup.exe | Select-Object -First 1).FullName
          $Zip = (Get-ChildItem build\release_artifacts\Open-Android-DeX-*-Windows-x64-Portable.zip | Select-Object -First 1).FullName
          if (-not $Setup -or -not (Test-Path $Setup) -or (Get-Item $Setup).Length -lt 100000) {
            Write-Error "❌ Error: Installer is missing or invalid size."
            exit 1
          }
          if (-not $Zip -or -not (Test-Path $Zip) -or (Get-Item $Zip).Length -lt 100000) {
            Write-Error "❌ Error: Portable ZIP is missing or invalid size."
            exit 1
          }

          # Deep inspect Portable ZIP: verify open_android_dex.exe and runtime dependencies
          Write-Host "==> Verifying contents of Portable ZIP ($Zip)..."
          $tempExtract = "build\temp_verify_zip"
          Expand-Archive -Path $Zip -DestinationPath $tempExtract -Force
          $ZipExe = "$tempExtract\open_android_dex.exe"
          if (-not (Test-Path $ZipExe) -or (Get-Item $ZipExe).Length -lt 100000) {
            Write-Error "❌ CRITICAL: open_android_dex.exe is MISSING or corrupt inside Portable ZIP!"
            exit 1
          }
          $ZipFlutterDll = "$tempExtract\flutter_windows.dll"
          if (-not (Test-Path $ZipFlutterDll)) {
            Write-Error "❌ CRITICAL: flutter_windows.dll is MISSING inside Portable ZIP!"
            exit 1
          }
          $ZipAdb = "$tempExtract\adb.exe"
          if (-not (Test-Path $ZipAdb)) {
            Write-Error "❌ CRITICAL: adb.exe is MISSING inside Portable ZIP!"
            exit 1
          }
          $ZipScrcpy = "$tempExtract\scrcpy.exe"
          if (-not (Test-Path $ZipScrcpy)) {
            Write-Error "❌ CRITICAL: scrcpy.exe is MISSING inside Portable ZIP!"
            exit 1
          }
          Remove-Item -Recurse -Force $tempExtract
          Write-Host "  ✅ Portable ZIP verified: open_android_dex.exe and all dependencies present!" -ForegroundColor Green

          Get-FileHash -Algorithm SHA256 $Setup, $Zip | Format-Table

      - name: Upload Windows Setup Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-setup
          path: build/release_artifacts/Open-Android-DeX-*-Windows-x64-Setup.exe
          retention-days: 7

      - name: Upload Windows Portable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: build/release_artifacts/Open-Android-DeX-*-Windows-x64-Portable.zip
          retention-days: 7

  publish-release:
    name: 📦 Publish GitHub Release
    needs: [build-linux-appimage, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download All Release Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_files
          merge-multiple: true

      - name: Compute SHA256 Checksums
        working-directory: release_files
        run: |
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create Unversioned Release Aliases
        working-directory: release_files
        run: |
          for f in Open-Android-DeX-*-Linux-x86_64.AppImage; do
            [ -f "$f" ] && cp -v "$f" "Open-Android-DeX-Linux-x86_64.AppImage" || true
          done
          for f in Open-Android-DeX-*-Windows-x64-Setup.exe; do
            [ -f "$f" ] && cp -v "$f" "Open-Android-DeX-Windows-x64-Setup.exe" || true
          done
          for f in Open-Android-DeX-*-Windows-x64-Portable.zip; do
            [ -f "$f" ] && cp -v "$f" "Open-Android-DeX-Windows-x64-Portable.zip" || true
          done

      - name: Resolve Release Tag & Draft Flag
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
            DRAFT="${{ github.event.inputs.draft }}"
          else
            TAG="${{ github.ref_name }}"
            DRAFT="false"
          fi
          echo "tag=${TAG:-v2.0.4}" >> $GITHUB_OUTPUT
          echo "draft=${DRAFT:-false}" >> $GITHUB_OUTPUT

      - name: Generate Release Notes
        id: notes
        run: |
          TAG="${{ steps.vars.outputs.tag }}"
          cat << 'EOF' > RELEASE_NOTES.md
          # Open Android DeX — __TAG__

          Welcome to the release of **Open Android DeX** (__TAG__)!

          ---

          ## 🚀 What's New in __TAG__

          ### ⚡ Ultra-Low Latency & Desktop Multi-Window Mode (Resolves #13)
          - **Eliminated Stream Latency (<15ms)**:
            - Configured native Windows FFmpeg decoder with zero stream analysis delay (`analyzeduration = 0`, `probesize = 32768`).
            - Enabled `AV_CODEC_FLAG_LOW_DELAY`, `AV_CODEC_FLAG2_FAST`, and ultra-fast bilinear scaling (`SWS_FAST_BILINEAR`).
            - Added `--video-buffer=0` to eliminate client-side video frame buffering.
          - **Proper Desktop Display Attachment**:
            - Switched app launching to `--start-app=+$packageName` (force new task) so apps open directly in the virtual desktop window instead of sticking to the phone's primary portrait screen.

          ### 🖥️ Blank Screen & Maximize Fix (Resolves #14)
          - **Automatic Developer Options Configuration**:
            - Automatically injects Android multi-window compatibility settings (`force_resizable_activities 1`, `enable_freeform_support 1`, `force_desktop_mode_on_external_displays 1`) via ADB on connection.
          - **Non-Destructive Resizing**:
            - Enabled `--no-vd-destroy-content` to preserve running app contexts during window resizing and display reconfiguration.
            - Viewport retains previous video frames while re-negotiating resolution textures, eliminating blank/black flashes on window maximize.

          ### 📐 Custom Resolution & DPI Controls (Resolves #15)
          - **Display Resolution Settings Dialog**:
            - Choose from 8 curated presets:
              - **Auto (Window Adaptive)**: Dynamically scales to exact window dimensions
              - **1080p Desktop**: 1920×1080 @ 240 DPI
              - **16:10 Widescreen**: 1920×1200 @ 240 DPI
              - **720p HD**: 1280×720 @ 180 DPI
              - **900p HD+**: 1600×900 @ 210 DPI
              - **2K QHD**: 2560×1440 @ 320 DPI
              - **Tablet / DeX Pad**: 1600×1000 @ 220 DPI
              - **Phone Portrait**: 1080×2340 @ 420 DPI
            - **Custom Resolution & DPI**: Specify custom width (320–7680), height (240–4320), and DPI (96–640).
            - Accessible directly from the **Quick Settings Panel** or from the window title bar action icon.

          ### 📱 Physical Phone Screen Power Toggle (Resolves #16)
          - **Save Battery & Prevent Screen Burn-In**:
            - Added **Phone Screen** tile in the Quick Settings panel to toggle the physical device screen off or on at any time.
            - Added a quick-toggle screen button in the taskbar system tray for 1-click access.
            - Keeps the DeX desktop streaming session completely active while the phone display is turned off.

          ### 🗂️ Clean App Drawer & Robust Icon Extraction (Resolves #17)
          - **Default Hidden System Apps**:
            - Automatically filters out internal Android background daemons (`Traceur`, `SystemUI`, Knox authentication, carrier overlays).
            - Genuine system apps (Settings, Camera, Files, Gallery, Phone, etc.) are separated from user apps.
            - App Drawer hides system apps by default with an interactive pill toggle to reveal them anytime.
          - **Reliable Icon Extraction**:
            - Replaced faulty device shell redirection with direct `adb exec-out` binary streaming and clean base64 piping, ensuring icons extract reliably across Samsung One UI and Android 16.

          ### 📦 Distributions
          - **Windows 11 (x64)**:
            - `Open-Android-DeX-Windows-x64-Setup.exe` (Complete Inno Setup installer)
            - `Open-Android-DeX-Windows-x64-Portable.zip` (Zero-install standalone package)
          - **Linux (x86_64)**:
            - `Open-Android-DeX-Linux-x86_64.AppImage` (Self-contained executable for Wayland & X11)

          ---

          ## 📋 Release Checksums (SHA-256)
          EOF

          sed -i "s/__TAG__/${TAG}/g" RELEASE_NOTES.md
          cat release_files/SHA256SUMS.txt >> RELEASE_NOTES.md

      - name: Publish Release on GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: "Open Android DeX ${{ steps.vars.outputs.tag }}"
          body_path: RELEASE_NOTES.md
          draft: ${{ steps.vars.outputs.draft == 'true' }}
          prerelease: false
          make_latest: true
          files: |
            release_files/*
