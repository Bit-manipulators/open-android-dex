name: Bug Report
description: Report a reproducible problem or crash in Open Android DeX
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please provide as much detail as possible to help us reproduce and resolve it.
  - type: dropdown
    id: component
    attributes:
      label: Affected Component
      description: Which part of Open Android DeX is experiencing the issue?
      options:
        - Flutter Desktop Compositor (lib/)
        - Native C++ Streaming Pipeline (linux/)
        - Python / GTK4 Shell (app.py)
        - Android Companion App (android_companion/)
        - Device Detection / ADB Connection
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Problem Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Detailed steps to reproduce the behavior.
      placeholder: |
        1. Connect phone via USB debugging
        2. Run `./run_flutter_dex.sh`
        3. Click on ...
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment & Hardware
      description: Please share your host OS, Android phone model, and Android version.
      placeholder: |
        - Host Linux Distro: (e.g. Arch Linux, Ubuntu 24.04, Debian 13)
        - Display Server: (Wayland or X11)
        - Phone Model: (e.g. Motorola moto g54, Pixel 7)
        - Android Version: (e.g. Android 14, 15, 16)
        - Scrcpy Version: (scrcpy --version)
        - Flutter Version (if applicable): (flutter --version)
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs or Terminal Output
      description: Paste any error messages, terminal logs, or stack traces.
      render: shell
