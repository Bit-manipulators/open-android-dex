[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "android-dex"
version = "0.1.0"
description = "Original GTK4 desktop app to control Android devices via ADB/scrcpy"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Android Dex contributors" }]
dependencies = []

[project.scripts]
android-dex = "app:main"

[tool.setuptools]
py-modules = [
    "app",
    "adb_client",
    "scrcpy_client",
    "input_controller",
    "volume_control",
    "url_launcher",
    "window_manager",
]
