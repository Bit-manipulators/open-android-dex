[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "open-android-dex"
version = "0.2.0"
description = "Open Android Dex — clean-room GTK4 desktop shell for Android phones via ADB/scrcpy"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Open Android Dex contributors" }]
dependencies = []

[project.scripts]
open-android-dex = "app:main"
openandroiddex = "app:main"

[tool.setuptools]
py-modules = [
    "app",
    "adb_client",
    "scrcpy_client",
    "input_controller",
    "volume_control",
    "url_launcher",
    "window_manager",
    "device_manager",
    "boot_manager",
]
