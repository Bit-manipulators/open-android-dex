[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "android-desktop-remote"
version = "0.1.0"
description = "Original GTK4 desktop app to control Android devices via ADB/scrcpy"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Android Desktop Remote contributors" }]
dependencies = []

[project.scripts]
android-desktop-remote = "android_desktop_remote.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["android_desktop_remote*"]
